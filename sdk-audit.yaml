  - {field: device.manufacturer, type: string, unit: none, always_present: true, evidence: DeviceContext.swift}  # "Apple"
  - {field: device.os, type: string, unit: none, always_present: true, evidence: DeviceContext.swift}  # "ios"
  - {field: device.platform_version, type: string, unit: none, always_present: false, evidence: DeviceContext.swift}  # NOT device.osVersion
  - {field: device.model, type: string, unit: none, always_present: false, evidence: DeviceContext.swift}
  - {field: device.isVirtual, type: bool, unit: none, always_present: true, evidence: DeviceContext.swift}
