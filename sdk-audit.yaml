repo: unknown/edge-rum-ios          # git org not in repo; pod name "EdgeRum", podspec homepage unknown
component_type: sdk
platform: ios
language: Swift (Swift 5.10 source / swift-tools 6.0 toolchain)
current_version: 1.0.0-alpha.1      # VERSION file + .release-please-manifest.json + CHANGELOG + podspec (all agree)
build_variants: >
  Two SwiftPM library products — EdgeRum (dynamic) and EdgeRumStatic (static)
  (Package.swift:27-37); XCFramework (iphoneos, iphonesimulator, maccatalyst per
  release.yml). CocoaPods pod omits the EdgeRumOTelBridge target (EdgeRum.podspec:6-14).
registry: cocoapods (trunk) + spm (git) + XCFramework via GitHub Releases

# ============================================================================
# 1. Events emitted  (wire names verbatim)
# Emission verbs: Recorder.recordEvent -> wire type "event"; Recorder.recordPerformance
# -> wire type "metric". Encoding: EventEnvelope.swift:66-93 — "event" uses key
# `eventName`, "metric" uses key `metricName` + optional scalar `value`.
# Only event-SPECIFIC keys listed; common identity attrs are in section 2.
# ============================================================================
events:
  - name: session.started
    trigger: EdgeRum.start() (fresh session) and idle-rotation (>30min); bypasses sampler (forced-emit)
    evidence: Recorder.swift:289 recordEvent("session.started"); rotation Recorder.swift:518
    payload_fields:
      - {field: session.rotation, type: string, unit: none, always_present: false}  # "idle" only on idle-rotation path

  - name: session.finalized
    trigger: EdgeRum.stop()/shutdown, UIApplication.willResignActive & willTerminate, idle-rotation. Immediate flush. Forced-emit.
    evidence: Recorder.swift:306; LifecycleCapture.swift:134 emitSessionFinalized(); rotation Recorder.swift:514
    payload_fields:
      - {field: session.id, type: string, unit: none, always_present: false}       # prior-session identity, rotation path only
      - {field: session.start_time, type: string, unit: none, always_present: false}
      - {field: session.sequence, type: int, unit: none, always_present: false}
      - {field: session.rotation, type: string, unit: none, always_present: false} # "idle"

  - name: app_lifecycle
    trigger: NotificationCenter on 5 UIApplication states (willResignActive/didEnterBackground/willEnterForeground/didBecomeActive/willTerminate). config.captureLifecycle.
    evidence: LifecycleCapture.swift:121 emit(state:)
    payload_fields:
      - {field: lifecycle.state, type: string, unit: none, always_present: true}          # inactive|backgrounded|foregrounded|active|will_terminate
      - {field: lifecycle.previous_state, type: string, unit: none, always_present: true}  # "unknown" until first

  - name: page_load
    trigger: Once per process; CADisplayLink first active tick vs launchStart. config.capturePageLoad.
    evidence: PageLoadCapture.swift:224
    payload_fields:
      - {field: page_load.duration_ms, type: int, unit: ms, always_present: true}
      - {field: page_load.cold_start, type: bool, unit: none, always_present: true}   # == !prewarmed
      - {field: page_load.prewarmed, type: bool, unit: none, always_present: true}    # iOS15+ ActivePrewarm=="1"
      - {field: page_load.source, type: string, unit: none, always_present: true}     # "displaylink"

  - name: navigation
    trigger: >
      THREE emitters, DIFFERENT key sets: (a) UIKit viewDidAppear swizzle
      (config.captureScreens, incl. UIHostingController->kind "swiftui");
      (b) public EdgeRum.trackScreen(); (c) SwiftUI .edgeRumScreen() onAppear.
    evidence: UIViewControllerCapture.swift:309; EdgeRum.swift:340; ViewModifiers.swift:54
    payload_fields:
      - {field: navigation.screen, type: string, unit: none, always_present: false}         # UIKit + SwiftUI-modifier paths
      - {field: navigation.kind, type: string, unit: none, always_present: false}           # "uikit"|"swiftui"; NOT set by trackScreen()
      - {field: navigation.type, type: string, unit: none, always_present: false}           # "viewDidAppear"; NOT set by trackScreen()
      - {field: navigation.previous_screen, type: string, unit: none, always_present: false} # UIKit path, omitted when none
      - {field: navigation.name, type: string, unit: none, always_present: false}           # trackScreen() path only (NOT navigation.screen)

  - name: screen.duration
    type_note: metric (metricName == "screen.duration")
    trigger: UIKit viewWillDisappear swizzle (paired appear) and SwiftUI .edgeRumScreen() onDisappear.
    evidence: UIViewControllerCapture.swift:337; ViewModifiers.swift:81
    payload_fields:
      - {field: screen.name, type: string, unit: none, always_present: true}
      - {field: screen.kind, type: string, unit: none, always_present: true}       # "uikit"|"swiftui"
      - {field: screen.duration_ms, type: int, unit: ms, always_present: true}
      - {field: value, type: double, unit: s, always_present: true}                # headline metric scalar = dwell seconds

  - name: http.request
    trigger: EdgeRumURLProtocol + URLSessionConfiguration.protocolClasses swizzle; on task completion. config.captureHTTP. Filtered by internal-header/ignoreUrls/sanitizeUrl.
    evidence: HTTPCapture.swift:350
    payload_fields:
      - {field: http.method, type: string, unit: none, always_present: true}
      - {field: http.url, type: string, unit: none, always_present: true}           # full absoluteString incl. query unless sanitizeUrl set
      - {field: http.host, type: string, unit: none, always_present: true}
      - {field: http.path, type: string, unit: none, always_present: true}
      - {field: http.status_code, type: int, unit: none, always_present: true}      # 0 when no HTTPURLResponse
      - {field: http.duration_ms, type: int, unit: ms, always_present: true}
      - {field: http.request_size, type: int, unit: bytes, always_present: true}
      - {field: http.response_size, type: int, unit: bytes, always_present: true}
      - {field: http.from_cache, type: bool, unit: none, always_present: true}
      - {field: http.error, type: string, unit: none, always_present: false}        # omitted unless error; String(describing:error)
      # F17 enrichment (only when URLSessionTaskMetrics view present):
      - {field: http.redirect_count, type: int, unit: none, always_present: false}
      - {field: http.tls_protocol, type: string, unit: none, always_present: false}
      - {field: http.tls_cipher, type: string, unit: none, always_present: false}
      - {field: http.reused_connection, type: bool, unit: none, always_present: false}
      - {field: http.proxy_connection, type: bool, unit: none, always_present: false}
      - {field: http.network_protocol, type: string, unit: none, always_present: false}
      - {field: http.request_body_bytes_before_encoding, type: int, unit: bytes, always_present: false}
      - {field: http.cellular_fallback, type: bool, unit: none, always_present: false}  # iOS17+

  - name: resource_timing
    type_note: metric (metricName == "resource_timing")
    trigger: Same http path, only when metrics view present with >=1 transaction (from last transaction).
    evidence: HTTPCapture.swift:371
    payload_fields:
      - {field: resource.url, type: string, unit: none, always_present: true}
      - {field: resource.host, type: string, unit: none, always_present: true}
      - {field: resource.dns_ms, type: int, unit: ms, always_present: true}
      - {field: resource.connect_ms, type: int, unit: ms, always_present: true}
      - {field: resource.tls_ms, type: int, unit: ms, always_present: true}
      - {field: resource.ttfb_ms, type: int, unit: ms, always_present: true}
      - {field: resource.download_ms, type: int, unit: ms, always_present: true}
      - {field: resource.redirect_count, type: int, unit: none, always_present: true}
      - {field: resource.transaction_count, type: int, unit: none, always_present: true}
      - {field: resource.fetch_start_to_response_end_ms, type: int, unit: ms, always_present: false}
      - {field: resource.protocol, type: string, unit: none, always_present: false}
      - {field: value, type: double, unit: ms, always_present: true}

  - name: user.interaction
    trigger: >
      TWO emitters, DIFFERENT key sets: (a) UIKit UIWindow.sendEvent swizzle, one per
      touch reaching .ended (config.captureTaps; DROPPED if responder chain has a secure
      text field); (b) SwiftUI .edgeRumTrackTap() simultaneousGesture.
    evidence: InteractionCapture.swift:180; ViewModifiers.swift:98
    payload_fields:
      - {field: interaction.kind, type: string, unit: none, always_present: true}          # "tap"
      - {field: interaction.target, type: string, unit: none, always_present: false}        # UIKit: type(of: target)
      - {field: interaction.target_id, type: string, unit: none, always_present: false}     # UIKit: a11y id / UIButton title
      - {field: interaction.screen, type: string, unit: none, always_present: false}        # UIKit
      - {field: interaction.name, type: string, unit: none, always_present: false}          # SwiftUI path only

  - name: network_change
    trigger: NWPathMonitor transition; deduped on (type,effectiveType,expensive,constrained,unsatisfiedReason). config.captureNetworkChanges. Forced-emit (bypasses sampler).
    evidence: NetworkPathCapture.swift:242
    payload_fields:
      - {field: network.type, type: string, unit: none, always_present: true}          # overrides common ctx key
      - {field: network.effectiveType, type: string, unit: none, always_present: true} # overrides common ctx key
      - {field: network.is_expensive, type: bool, unit: none, always_present: true}
      - {field: network.is_constrained, type: bool, unit: none, always_present: true}
      - {field: network.unsatisfied_reason, type: string, unit: none, always_present: false}

  - name: user.profile.update
    trigger: EdgeRum.identify(UserContext). Attaches host id/name/email/phone; does NOT change generated user.id.
    evidence: Recorder.swift:385-395 setUser()
    payload_fields:
      - {field: user.name, type: string, unit: none, always_present: false}
      - {field: user.email, type: string, unit: none, always_present: false}
      - {field: user.phone, type: string, unit: none, always_present: false}
      - {field: user.external_id, type: string, unit: none, always_present: false}   # host-supplied UserContext.id

  - name: custom_event
    trigger: EdgeRum.track(name, attributes). Original name carried as event.name attribute.
    evidence: EdgeRum.swift:330
    payload_fields:
      - {field: event.name, type: string, unit: none, always_present: true}          # user-supplied name
      - {field: "<caller attributes>", type: any-primitive, unit: none, always_present: false}

  - name: app.crash
    trigger: >
      THREE causes, discriminated by `cause`: (a) "AppError" — EdgeRum.captureError()
      (immediate flush); (b) "NativeCrash" — PLCrashReporter Mach signal (SIGSEGV/SIGABRT/
      SIGBUS/SIGILL) or NSException, REPLAYED on next launch; (c) "Hang" — main-thread
      hang watchdog. NativeCrash replay OVERWRITES common session/device/user identity
      with the CRASHED session's (from sidecar). Forced-emit.
    evidence: AppErrorBuilder.swift + EdgeRum.swift:384; PLCrashIntegration.swift:174 + CrashReportEncoder.swift; HangDetector.swift:334 + HangEventEncoder.swift
    payload_fields:
      - {field: cause, type: string, unit: none, always_present: true}               # AppError|NativeCrash|Hang
      - {field: runtime, type: string, unit: none, always_present: true}             # swift|native
      - {field: crash.fatal, type: bool, unit: none, always_present: false}          # native/hang paths
      # cause=AppError:
      - {field: error.type, type: string, unit: none, always_present: false}
      - {field: error.message, type: string, unit: none, always_present: false}      # localizedDescription — PII risk (§5)
      - {field: error.kind, type: string, unit: none, always_present: false}         # nserror|swift
      - {field: error.domain, type: string, unit: none, always_present: false}
      - {field: error.code, type: int, unit: none, always_present: false}
      - {field: "error.userInfo.<key>", type: any-primitive, unit: none, always_present: false}
      - {field: error.stack, type: string, unit: none, always_present: false}        # \n-joined, truncated 4096 UTF-8 bytes
      - {field: "crash.context.<key>", type: any-primitive, unit: none, always_present: false}
      # cause=NativeCrash:
      - {field: crash.report_format_version, type: string, unit: none, always_present: false}  # "edgerum.crash.v1"
      - {field: crash.signal, type: string, unit: none, always_present: false}
      - {field: crash.signal_code, type: string, unit: none, always_present: false}
      - {field: crash.exception_name, type: string, unit: none, always_present: false}
      - {field: crash.exception_reason, type: string, unit: none, always_present: false}       # PII risk
      - {field: crash.timestamp, type: string, unit: none, always_present: false}              # ISO8601
      - {field: crash.os_version, type: string, unit: none, always_present: false}
      - {field: crash.binary_uuid, type: string, unit: none, always_present: false}
      - {field: crash.binary_name, type: string, unit: none, always_present: false}
      - {field: crash.report_json, type: string, unit: none, always_present: false}            # JSON-stringified full report; addresses NOT symbolicated; top-30 frames/thread
      # cause=Hang:
      - {field: hang.duration_ms, type: double, unit: ms, always_present: false}
      - {field: hang.threshold_ms, type: double, unit: ms, always_present: false}
      - {field: hang.cpu_usage, type: double, unit: ratio, always_present: false}              # ALWAYS omitted in prod (cpuProvider nil)
      - {field: crash.thread.main_stack, type: string, unit: none, always_present: false}      # top-30 frames

  - name: frame_render_time
    type_note: metric
    trigger: CADisplayLink; per-tick deltas aggregated, flushed ~1s. config.captureRenderingPerformance.
    evidence: FrameSampler.swift:221
    payload_fields:
      - {field: frame.max_ms, type: double, unit: ms, always_present: true}
      - {field: frame.p95_ms, type: double, unit: ms, always_present: true}
      - {field: frame.dropped_count, type: int, unit: none, always_present: true}
      - {field: frame.target_hz, type: int, unit: hz, always_present: true}
      - {field: frame.source, type: string, unit: none, always_present: true}       # "displaylink"
      - {field: frame.sample_count, type: int, unit: none, always_present: true}
      - {field: value, type: double, unit: ms, always_present: true}                # == max_ms

  - name: memory_usage
    type_note: metric
    trigger: DispatchSourceTimer every 10s (pressure normal) + memory-pressure source. config.captureRenderingPerformance.
    evidence: MemorySampler.swift:151
    payload_fields:
      - {field: memory.resident_kb, type: int, unit: kb, always_present: true}
      - {field: memory.virtual_kb, type: int, unit: kb, always_present: true}
      - {field: memory.footprint_kb, type: int, unit: kb, always_present: true}
      - {field: memory.pressure, type: string, unit: none, always_present: true}    # normal|warning|critical
      - {field: value, type: double, unit: kb, always_present: true}                # == resident_kb

  - name: long_task
    type_note: metric
    trigger: CFRunLoopObserver on main runloop; wake->sleep interval >= 50ms. config.captureRenderingPerformance.
    evidence: RunLoopObserverCapture.swift:132
    payload_fields:
      - {field: value, type: double, unit: ms, always_present: true}
      - {field: long_task.threshold_ms, type: double, unit: ms, always_present: true}  # 50.0
      - {field: long_task.stack, type: string, unit: none, always_present: true}       # truncated 4096 UTF-8 bytes

  - name: "<user-supplied>"
    type_note: metric (metricName == the EdgeRum.time() argument, verbatim)
    trigger: EdgeRum.time(name).end(attributes). Idempotent.
    evidence: RumTimer.swift:62
    payload_fields:
      - {field: duration_ms, type: int, unit: ms, always_present: true}
      - {field: "<caller attributes>", type: any-primitive, unit: none, always_present: false}

# ============================================================================
# 2. Common attributes  (merged into EVERY event via ContextProvider.snapshot,
# PayloadBuilder merges context first, event attrs win on conflict)
# Evidence: Sources/EdgeRumCore/Context/*.swift write(into:); ContextProvider.swift:70-84
# NOTE: groups power/accessibility/storage are BEYOND the 6 documented in CLAUDE.md.
# ============================================================================
common_attributes:
  # app (AppContext) — all setIfPresent (omitted when nil)
  - {field: app.name, type: string, unit: none, always_present: false, evidence: AppContext.swift}
  - {field: app.package_name, type: string, unit: none, always_present: false, evidence: AppContext.swift}   # NOT app.package
  - {field: app.version, type: string, unit: none, always_present: false, evidence: AppContext.swift}
  - {field: app.build_number, type: string, unit: none, always_present: false, evidence: AppContext.swift}
  - {field: app.environment, type: string, unit: none, always_present: false, evidence: AppContext.swift}
  - {field: app.background_refresh, type: string, unit: none, always_present: false, evidence: StorageContext.swift}  # NOTE string, not bool
  # device identity + hardware (DeviceContext, SdkContext for device.id)
