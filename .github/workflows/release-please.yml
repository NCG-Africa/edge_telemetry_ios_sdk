# .github/workflows/release-please.yml
#
# Conventional-commit driven release automation (ADR-015).
#
# On every push to main, release-please maintains a "chore: release
# X.Y.Z" pull request that:
#   - bumps version.txt (the repo-root VERSION file is a symlink to it,
#     so gen-version.sh, the podspec, and release.yml all see the new
#     version with no extra plumbing), and
#   - updates CHANGELOG.md from feat: / fix: / feat!: commit messages.
#
# Merging that PR pushes a vX.Y.Z tag and creates the GitHub Release
# with the generated notes. The tag push then fires release.yml, which
# builds + attaches the XCFramework and pushes the CocoaPods trunk spec.
#
# IMPORTANT — downstream trigger: a tag pushed with the default
# GITHUB_TOKEN does NOT trigger other workflows. For release.yml to fire
# on the tag automatically, release-please must push it with a PAT (or
# GitHub App token) exposed as the RELEASE_PLEASE_TOKEN secret
# (scopes: contents:write, pull-requests:write). Without that secret it
# falls back to GITHUB_TOKEN — the release + tag are still created, but
# you must then run release.yml manually via its workflow_dispatch to
# build and attach artifacts.

name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
