# .github/workflows/conform.yml
#
# #264 (processor #40). Runs Tools/conform.sh: the golden batches in
# Tests/golden must match the event catalogue at the tag pinned in
# catalogue.version. Go only, so it runs on Linux. Same triggers as the
# other checks (#265): a v* tag, or by hand on a PR branch.

name: conform

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conform:
    name: goldens match the event catalogue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Run conform.sh
        run: ./Tools/conform.sh
